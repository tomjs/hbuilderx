<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
      }

      #webview-patch-iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .outer {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>

    <script type="module" id="webview-patch">
      const TAG = '[@tomjs:hbuilderx:extension] ';
      const POST_MESSAGE_TYPE = '[hbuilderx:client]:postMessage';
      const SERVER_URL = '{{serverUrl}}';

      let iframe = null;
      let iframeLoaded = false;
      // 插件 → iframe 方向的消息缓存：iframe 未就绪时先暂存，就绪后按序补发
      const cacheMessages = [];

      function onDomReady(callback, doc = document) {
        if (doc.readyState === 'interactive' || doc.readyState === 'complete') {
          callback();
        } else {
          doc.addEventListener('DOMContentLoaded', callback);
        }
      }

      function flushCache() {
        if (!iframe || !iframeLoaded || !iframe.contentWindow) {
          return;
        }
        while (cacheMessages.length) {
          iframe.contentWindow.postMessage(cacheMessages.shift(), '*');
        }
      }

      // 插件 → iframe：收到插件消息后转发给 vite dev server 页面。
      // 注意不能直接用 iframe.contentDocument（跨域会抛错），用 load 事件判断就绪。
      function forwardToIframe(message) {
        if (!iframe || !iframe.contentWindow) {
          return;
        }
        if (iframeLoaded) {
          iframe.contentWindow.postMessage(message, '*');
        } else {
          cacheMessages.push(message);
        }
      }

      if (typeof hbuilderx !== 'undefined' && hbuilderx.onDidReceiveMessage) {
        hbuilderx.onDidReceiveMessage(forwardToIframe);
      }

      // iframe → 插件：仅转发由 client.ts 发出的 postMessage
      window.addEventListener('message', (event) => {
        if (!iframeLoaded || !iframe) {
          return;
        }
        if (!SERVER_URL.startsWith(event.origin)) {
          return;
        }
        const { type, data } = event.data || {};
        if (type === POST_MESSAGE_TYPE) {
          hbuilderx.postMessage(data);
        }
      });

      onDomReady(() => {
        iframe = document.getElementById('webview-patch-iframe');
        if (!iframe) {
          return;
        }
        iframe.addEventListener('load', () => {
          iframeLoaded = true;
          flushCache();
        });
      });
    </script>
  </head>

  <body>
    <div class="outer">
      <iframe
        id="webview-patch-iframe"
        frameborder="0"
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-downloads"
        allow="cross-origin-isolated; autoplay; clipboard-read; clipboard-write"
        src="{{serverUrl}}"
      ></iframe>
    </div>
  </body>
</html>
